name: media-tools
version: "1.1.1"
description: "Bounded offline CPU MP4, WAV and FLAC conversion with pinned FFmpeg."
author: "alibaba-agent-sandbox"
license: Apache-2.0
spec_version: 5
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 2048
ports: [9000]
tags: [ffmpeg, media, cpu, audio, video]
priority: P2
wave: 1
env:
  ABX_SERVER_TOKEN: ""
smoke:
  - command: media_version
    args: {}
    expect: "FFmpeg 7.1.5-0+deb13u1"
  - command: media_smoke
    args: {}
    expect: "FFmpeg CPU audio transcode OK"
  - command: media_video_smoke
    args: {}
    expect: "FFmpeg CPU H.264 video transcode OK"
  - command: media_args_smoke
    args: {}
    expect: "FFmpeg native argv audio transcode OK"
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
