name: codex-agent-api
version: "2.0.0"
description: "Project session HTTP API backed by pinned upstream Codex exec JSONL."
author: "alibaba-agent-sandbox"
license: Apache-2.0
spec_version: 2
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 4096
ports: [9000]
tags: [codex, openai, agents-api, ai-agent, self-hosted]
priority: P1
wave: 1
tested_on: [alicloud-express, opensandbox]
capabilities: [shell, files, code, ports]
env:
  OPENAI_API_KEY: ""
  CODEX_API_KEY: ""
  ABX_LLM_API_KEY: ""
  OPENAI_BASE_URL: ""
  ABX_LLM_BASE_URL: ""
  CODEX_MODEL: ""
  CODEX_HOME: "/home/user/.codex"
  CODEX_SANDBOX: "workspace-write"
  AGENT_MAX_SESSIONS: "20"
  AGENT_SESSION_TTL: "1800"
  WORKSPACE: "/home/user/workspace"
  ABX_SERVER_TOKEN: ""
smoke:
  - command: codex_version
    expect: "0.162.1"
  - command: agent_status
    expect: "[]"
