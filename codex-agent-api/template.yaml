specVersion: 1
name: codex-agent-api
sandbox:
  template:
    source:
      dockerfile: Dockerfile
      context: .
    props:
      cpu: 2
      memory: 4096
  start: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
  ready: agent-sandbox-server healthcheck --port 9000
  instance:
    envs:
      OPENAI_API_KEY: ''
      CODEX_API_KEY: ''
      ABX_LLM_API_KEY: ''
      OPENAI_BASE_URL: ''
      ABX_LLM_BASE_URL: ''
      CODEX_MODEL: ''
      CODEX_HOME: /home/user/.codex
      CODEX_SANDBOX: workspace-write
      AGENT_MAX_SESSIONS: '20'
      AGENT_SESSION_TTL: '1800'
      WORKSPACE: /home/user/workspace
      ABX_SERVER_TOKEN: ''
  services:
    app:
      protocol: agent-sandbox-server
      version: 2
      port: 9000
      operations:
      - commands.list
      - commands.run
