name: codex
version: "1.0.0"
description: "OpenAI Codex CLI Agent 运行环境 - 支持 AI 驱动的代码生成和执行"
author: "alibaba-agent-sandbox"
tags:
  - codex
  - openai
  - ai-agent
  - code-generation

base: python:3.12-slim

system_packages:
  - python3
  - python3-pip
  - git
  - curl
  - wget
  - build-essential
  - ripgrep
  - jq

python_packages:
  - openai>=1.0
  - rich
  - httpx

node_packages:
  - "@openai/codex"  # OpenAI Codex CLI (https://www.npmjs.com/package/@openai/codex)

capabilities:
  - shell
  - files
  - code
  - ports

ports:
  - 9000


env:
  OPENAI_API_KEY: ""
  CODEX_SANDBOX_MODE: "true"
  WORKSPACE: "/app"

resources:
  cpu: 2
  memory: 4096
