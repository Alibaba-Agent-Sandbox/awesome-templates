name: deepagents
version: 1.0.0
description: Pinned native DeepAgents0.7.25 with local file/shell backend, explicit
  compatible provider and no subagents.
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>
generation: 2
start_cmd: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
ready_cmd: agent-sandbox-server healthcheck --port 9000
resources:
  cpu: 2
  memory: 2048
ports:
- 9000
tags:
- deepagents
- coding-agent
- openai-compatible
priority: P1
wave: 2
env:
  ABX_SERVER_TOKEN: ''
  DEEPAGENTS_API_KEY: ''
  DEEPAGENTS_BASE_URL: ''
  DEEPAGENTS_MODEL: ''
  DEEPAGENTS_PYTHON: /opt/deepagents/bin/python
smoke:
- command: deepagents_version
  expect: 0.7.25
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
