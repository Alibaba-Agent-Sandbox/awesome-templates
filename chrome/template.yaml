name: chrome
version: "1.0.5"
description: "Pinned genuine headed Chrome with native CDP, authenticated noVNC framebuffer and owned non-root desktop lifecycle."
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources: {cpu: 2, memory: 2048}
ports: [9000, 9222, 6080]
tags: [chrome, chromium, browser, cdp, vnc, desktop]
priority: P1
wave: 2
env:
  ABX_SERVER_TOKEN: ""
  WORKSPACE: "/home/user/workspace"
smoke:
  - command: chrome_smoke
    expect: "native headed Chrome145.0.7632.6 CDP/VNC/PNG and cleanup OK"
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
