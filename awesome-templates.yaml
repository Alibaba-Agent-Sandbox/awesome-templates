# Agent Sandbox Community Templates
#
# A curated index of sandbox templates — official and community-contributed.
# Anyone can add their template by submitting a PR!
#
# How to contribute:
#   1. Fork this repository
#   2. Add your template entry under "# === Community Templates ===" below
#   3. Ensure all required fields are filled (name, description, repo, tags, author, capabilities, status)
#   4. Set status to "community" (or "experimental" for early-stage templates)
#   5. Open a PR — see CONTRIBUTING.md for full guidelines
#
# Schema:
#   - name:         Template display name (unique identifier)
#     description:  One-line description of what the template does
#     repo:         GitHub repository URL
#     path:         Path within repo (optional, for monorepos)
#     tags:         List of technology/topic tags for search
#     author:       Author name or GitHub handle
#     template_id:  Platform template ID (optional, if published to registry)
#     capabilities: List of required sandbox capabilities (shell, files, code, terminal, ports)
#     status:       "official" | "community" | "experimental"
#                   official only after L0, L1, and L2 in docs/template-spec.md
#     providers:    optional map ignored by schema_version 1 clients
#                   this map is not a verification record; see README "Verified on"
#
# Install any template with:
#   abx template install alibaba-agent-sandbox/awesome-templates//<name>

templates:
  # === Official Templates ===

  - name: python-hello
    description: "A minimal Python hello world template for testing"
    repo: https://github.com/alibaba-agent-sandbox/awesome-templates
    path: python-hello
    tags: [python, hello-world, example]
    author: alibaba-agent-sandbox
    capabilities: [shell, files, code, ports]
    status: official
    providers:
      alicloud-express: supported
      alicloud-container: preexisting-template-id
      cubesandbox: preexisting-template-id
      e2b: preexisting-template-id
      opensandbox: push-image-then-pass-uri

