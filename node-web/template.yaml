name: node-web
version: "1.0.0"
description: "Node.js Web 服务运行环境 - 支持 Express、Fastify 等框架的快速开发与部署"
author: "alibaba-agent-sandbox"
tags:
  - nodejs
  - web
  - express
  - api
  - javascript

base: python:3.12-slim

system_packages:
  - curl
  - wget
  - git
  - jq

node_packages:
  - yarn
  - nodemon
  - pm2

ports:
  - 3000
  - 9000

capabilities:
  - shell
  - files
  - code
  - ports


env:
  NODE_ENV: "production"
  PORT: "3000"

resources:
  cpu: 1
  memory: 2048
