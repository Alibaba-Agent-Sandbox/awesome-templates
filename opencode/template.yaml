specVersion: 1
name: opencode
sandbox:
  template:
    source:
      dockerfile: Dockerfile
      context: .
    props:
      cpu: 2
      memory: 2048
  start: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
  ready: agent-sandbox-server healthcheck --port 9000
  instance:
    envs:
      ABX_LLM_API_KEY: ''
      ABX_LLM_BASE_URL: ''
      OPENCODE_API_KEY: ''
      OPENCODE_MODEL: dashscope/qwen3.8-flash
      OPENCODE_SERVER_PASSWORD: ''
      ABX_SERVER_TOKEN: ''
  services:
    app:
      protocol: agent-sandbox-server
      version: 2
      port: 9000
      operations:
      - commands.list
      - commands.run
  ports:
  - 4096
