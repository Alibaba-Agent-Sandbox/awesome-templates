name: opencode
version: "2.0.0"
description: "OpenCode coding agent. Headless opencode run and optional opencode serve. Package opencode-ai@1.19.0."
author: "alibaba-agent-sandbox"
license: Apache-2.0
spec_version: 2

base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"

resources:
  cpu: 2
  memory: 2048

ports:
  - 9000
  - 4096

tags:
  - opencode
  - ai-agent
  - ai-coding

priority: P0
wave: 1
tested_on: []

capabilities:
  - shell
  - files
  - code
  - ports

env:
  ABX_LLM_API_KEY: ""
  ABX_LLM_BASE_URL: ""
  OPENCODE_API_KEY: ""
  OPENCODE_MODEL: "dashscope/qwen3.8-flash"
  OPENCODE_SERVER_PASSWORD: ""
  ABX_SERVER_TOKEN: ""

smoke:
  - command: opencode_version
    expect: "1.19.0"
  - command: opencode_setup_check
    expect: "ok"
