name: k3s
version: "1.0.0"
description: "Original non-root agentless K3s control-plane slice for strict ephemeral server-side manifest validation."
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 2
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 4096
ports: [9000]
tags: [k3s, kubernetes, validation]
priority: P2
wave: 2
tested_on: []
capabilities: [shell, files, code, ports]
env:
  ABX_SERVER_TOKEN: ""
smoke:
  - command: k3s_version
    args: {}
    expect: "v1.37.1+k3s1"
  - command: k3s_native_check
    args: {}
