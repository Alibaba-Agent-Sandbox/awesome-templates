name: openclaw
version: "1.0.0"
description: "OpenClaw AI Agent 运行环境 - 开源 AI 编程 Agent 网关与运行时"
author: "alibaba-agent-sandbox"
tags:
  - openclaw
  - ai-agent
  - ai-coding
  - gateway

base: python:3.12-slim

system_packages:
  - git
  - curl
  - ca-certificates

node_packages:
  - openclaw

ports:
  - 18789
  - 9000

capabilities:
  - shell
  - files
  - code
  - ports


env:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  WORKSPACE: "/app"

resources:
  cpu: 2
  memory: 4096
