name: openclaw
version: "2.1.1"
description: "Authenticated OpenClaw gateway with an owned background lifecycle."
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 4096
ports: [9000, 18789]
tags: [openclaw, ai-agent, gateway]
priority: P0
wave: 1
env:
  ABX_SERVER_TOKEN: ""
  OPENCLAW_GATEWAY_TOKEN: ""
  OPENCLAW_TRUSTED_PROXIES: ""
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
smoke:
  - command: gateway_status
    args: {}
    expect:
      running: false
      owned: false
      url: null
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
