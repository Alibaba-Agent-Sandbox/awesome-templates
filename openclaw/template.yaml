specVersion: 1
name: openclaw
sandbox:
  template:
    source:
      dockerfile: Dockerfile
      context: .
    props:
      cpu: 2
      memory: 4096
  start: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
  ready: agent-sandbox-server healthcheck --port 9000
  instance:
    envs:
      ABX_SERVER_TOKEN: ''
      OPENCLAW_GATEWAY_TOKEN: ''
      OPENCLAW_TRUSTED_PROXIES: ''
      OPENCLAW_MODEL_API_KEY: ''
      OPENCLAW_MODEL_BASE_URL: ''
      OPENCLAW_MODEL: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ''
  services:
    app:
      protocol: agent-sandbox-server
      version: 2
      port: 9000
      operations:
      - commands.list
      - commands.run
  ports:
  - 18789
