specVersion: 1
name: gemini
sandbox:
  template:
    source:
      dockerfile: Dockerfile
      context: .
    props:
      cpu: 2
      memory: 4096
  start: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
  ready: agent-sandbox-server healthcheck --port 9000
  instance:
    envs:
      ABX_SERVER_TOKEN: ''
      GEMINI_API_KEY: ''
      GEMINI_BYOK_API_KEY: ''
      GEMINI_BYOK_BASE_URL: ''
      GEMINI_BYOK_MODEL: ''
      GEMINI_MODEL: gemini-3.1-flash-lite
      WORKSPACE: /home/user/app
  services:
    app:
      protocol: agent-sandbox-server
      version: 2
      port: 9000
      operations:
      - commands.list
      - commands.run
