name: gemini
version: "2.2.0"
description: "Pinned Gemini CLI with typed headless commands and explicit tool approval."
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 4096
ports: [9000]
tags: [gemini, ai-coding, ai-agent]
priority: P0
wave: 1
env:
  ABX_SERVER_TOKEN: ""
  GEMINI_API_KEY: ""
  GEMINI_BYOK_API_KEY: ""
  GEMINI_BYOK_BASE_URL: ""
  GEMINI_BYOK_MODEL: ""
  GEMINI_MODEL: gemini-3.1-flash-lite
  WORKSPACE: /home/user/app
smoke:
  - command: gemini_version
    args: {}
    expect: "0.64.0"
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
