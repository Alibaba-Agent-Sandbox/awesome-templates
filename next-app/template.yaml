name: next-app
version: "1.1.2"
description: Pinned Next.js and Vite scaffolds with owned preview-server lifecycle.
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 5
base: fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>
generation: 2
start_cmd: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
ready_cmd: agent-sandbox-server healthcheck --port 9000
resources:
  cpu: 2
  memory: 2048
ports:
- 9000
- 3000
- 5173
tags:
- node
- nextjs
- vite
- preview
priority: P1
wave: 1
env:
  ABX_SERVER_TOKEN: ''
smoke:
- command: toolchain_versions
  expect:
    next: 16.4.2
    react: 19.3.1
    react-dom: 19.3.1
    vite: 8.3.4
- command: preview_self_test
  expect: NEXT_VITE_PREVIEW_OK
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
