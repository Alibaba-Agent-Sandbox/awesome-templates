name: qwen-code
version: "2.0.0"
description: "通义千问编码 Agent 运行环境 - 支持 qwen-code 驱动的 AI 自主部署"
author: "alibaba-agent-sandbox"
tags:
  - qwen
  - qwen-code
  - dashscope
  - ai-coding
  - ai-agent
  - deploy

base: python:3.12-slim

system_packages:
  - python3
  - python3-pip
  - nodejs
  - git
  - curl
  - wget
  - ripgrep
  - jq
  - build-essential

node_packages:
  - "@qwen-code/qwen-code@0.23.0"

python_packages:
  - dashscope
  - openai>=1.0
  - httpx
  - rich

capabilities:
  - shell
  - files
  - code
  - ports

ports:
  - 9000


env:
  DASHSCOPE_API_KEY: ""
  OPENAI_API_KEY: ""
  WORKSPACE: "/app"
  OPENAI_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  OPENAI_MODEL: "qwen3-coder-plus"

resources:
  cpu: 2
  memory: 4096
