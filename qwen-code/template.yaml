name: qwen-code
version: "2.1.1"
description: "Qwen Code CLI with typed headless commands and OpenAI-compatible authentication."
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 4096
ports: [9000]
tags: [qwen, qwen-code, dashscope, ai-coding]
priority: P0
wave: 1
env:
  ABX_SERVER_TOKEN: ""
  OPENAI_API_KEY: ""
  DASHSCOPE_API_KEY: ""
  WORKSPACE: /home/user/app
  OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
  OPENAI_MODEL: qwen3-coder-plus
smoke:
  - command: qwen_version
    args: {}
    expect: "0.23.0"
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
