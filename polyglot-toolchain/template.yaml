name: polyglot-toolchain
version: 1.0.1
description: Pinned Go 1.25.14, Rust 1.90.0 and Eclipse Temurin 21 toolchains with
  actual compilation proof.
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>
generation: 2
start_cmd: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
ready_cmd: agent-sandbox-server healthcheck --port 9000
resources:
  cpu: 2
  memory: 2048
ports:
- 9000
tags:
- go
- rust
- java
- toolchain
priority: P1
wave: 2
env:
  ABX_SERVER_TOKEN: ''
smoke:
- command: toolchain_smoke
  expect:
    go: GO_OK
    rust: RUST_OK
    java: JAVA_OK
    cleanup_verified: true
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
