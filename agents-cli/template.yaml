name: agents-cli
version: "2.0.1"
description: "Restricted local Agents HTTP API with pinned Codex and Qwen Code CLIs."
author: "alibaba-agent-sandbox"
license: Apache-2.0
spec_version: 4
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py --policy /home/user/app/server-policy.json"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 4096
ports: [9000]
tags: [agents-api, codex, qwen-code, self-hosted]
priority: P2
wave: 2
env:
  ABX_SERVER_TOKEN: ""
  OPENAI_API_KEY: ""
  CODEX_API_KEY: ""
  OPENAI_BASE_URL: ""
  OPENAI_MODEL: ""
  CODEX_HOME: "/home/user/.codex"
  ABX_SERVER_POLICY_FILE: "/home/user/app/server-policy.json"
  WORKSPACE: "/home/user/workspace"
smoke:
  - command: agents_version
    expect: "codex 0.162.1; qwen-code 0.23.0"
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
