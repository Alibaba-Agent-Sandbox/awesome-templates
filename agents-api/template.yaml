specVersion: 1
name: agents-api
sandbox:
  template:
    source:
      dockerfile: Dockerfile
      context: .
    props:
      cpu: 2
      memory: 4096
  instance:
    timeout: 3600
  provider: alicloud-express
deployment:
  edition: 3.0.0
  access: default
  vars:
    region: cn-hangzhou
    executionRole: ${env('AGENTS_FC_ROLE_ARN')}
  resources:
    gateway:
      component: fc3@0.1.26
      props:
        region: ${vars.region}
        runtime: custom-container
        cpu: 1
        memorySize: 1024
        timeout: 120
        role: ${vars.executionRole}
    worker:
      component: fc3@0.1.26
      props:
        region: ${vars.region}
        runtime: custom-container
        cpu: 2
        memorySize: 2048
        timeout: 86400
        role: ${vars.executionRole}
    dispatcher:
      component: fc3@0.1.26
      props:
        region: ${vars.region}
        runtime: custom-container
        cpu: 2
        memorySize: 2048
        timeout: 120
        role: ${vars.executionRole}
application:
  type: agents-api
  roles:
    gateway: gateway
    worker: worker
    dispatcher: dispatcher
  server:
    source:
      dockerfile: server/Dockerfile
      context: .
  state:
    databaseUrl: ${env('ABX_MANAGED_DATABASE_URL')}
  bindings:
    sandboxAccess:
      apiKey: ${env('SANDBOX_API_KEY')}
      baseUrl: ${env('SANDBOX_BASE_URL')}
      domain: ${env('SANDBOX_DOMAIN')}
      region: ${env('SANDBOX_REGION')}
    model:
      apiKey: ${env('OPENAI_API_KEY')}
      baseUrl: ${env('OPENAI_BASE_URL')}
      model: ${env('OPENAI_MODEL')}
      adapter: qwen-code
    clientAuth:
      generate: true
      owner: default
    internalAuth:
      generate: true
    ingress:
      kind: function-alias
      aliasName: prod
      allowTestDomain: true
  sessions:
    idleTimeoutSeconds: 900
    maxLogicalSessionsPerOwner: 100
    maxActiveSessions: 20
    maxQueuedTurnsPerSession: 8
    resultRetentionSeconds: 86400
  limits:
    maxRunSeconds: 600
    maxToolSeconds: 60
    maxConcurrentRuns: 10
    maxQueuedRuns: 80
    maxRunsPerMinute: 60
    maxEventsPerRun: 10000
    maxOutputBytes: 8388608
    maxSubscribersPerSession: 4
  storage:
    maxFileBytes: 10485760
    maxArtifactBytes: 10485760
    maxTurnArtifactBytes: 10485760
    maxRetainedBytesPerOwner: 104857600
  hooks:
    afterReady:
    - id: managed-agent-business
      type: custom
      argv:
      - python
      - scripts/smoke.py
      cwd: .
      timeoutSeconds: 900
      envAllowlist: []
