name: tau2-bench
version: "1.0.4"
description: "Pinned upstream Tau2 text retail runner with real agent/user models and strict native trajectory replay."
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources: {cpu: 2, memory: 2048}
ports: [9000]
tags: [tau2, benchmark, tools, retail]
priority: P1
wave: 2
env:
  ABX_SERVER_TOKEN: ""
  TAU2_MODEL_API_KEY: ""
  TAU2_MODEL_BASE_URL: ""
  TAU2_MODEL: ""
  WORKSPACE: "/home/user/workspace"
smoke:
  - command: tau2_version
    expect: {native_version: "1.0.1", domain: retail, task_count: 114}
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
