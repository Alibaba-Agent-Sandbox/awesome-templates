name: browser-use
version: 1.0.0
description: Native browser-use0.13.11 text-DOM agent on private pinned local Chromium.
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>
generation: 2
start_cmd: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
ready_cmd: agent-sandbox-server healthcheck --port 9000
resources:
  cpu: 2
  memory: 2048
ports:
- 9000
tags:
- browser-use
- browser
- coding-agent
priority: P0
wave: 1
env:
  ABX_SERVER_TOKEN: ''
  PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
  BROWSER_USE_PYTHON: /opt/browser-use/bin/python
  BROWSER_USE_API_KEY: ''
  BROWSER_USE_BASE_URL: ''
  BROWSER_USE_MODEL: ''
smoke:
- command: browser_use_version
  expect: 0.13.11
- command: browser_use_self_test
  expect: BROWSER_USE_NATIVE_OK
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
