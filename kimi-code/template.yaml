name: kimi-code
version: "1.0.1"
description: Pinned Kimi Code 2.2.0 with isolated headless turns and explicit tool
  permission.
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>
generation: 2
start_cmd: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
ready_cmd: agent-sandbox-server healthcheck --port 9000
resources:
  cpu: 2
  memory: 2048
ports:
- 9000
tags:
- kimi
- coding-agent
- openai-compatible
priority: P0
wave: 1
env:
  WORKSPACE: /home/user/app
  KIMI_MODEL_NAME: ''
  KIMI_MODEL_API_KEY: ''
  KIMI_MODEL_BASE_URL: ''
  KIMI_MODEL_PROVIDER_TYPE: openai
  ABX_SERVER_TOKEN: ''
smoke:
- command: kimi_version
  expect: 2.2.0
- command: kimi_setup_check
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
