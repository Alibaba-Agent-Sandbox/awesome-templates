name: code-server
version: 1.0.0
description: Pinned code-server4.141.0 browser IDE with mandatory password authentication,
  owned lifecycle and real login/workbench smoke.
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>
generation: 2
start_cmd: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
ready_cmd: agent-sandbox-server healthcheck --port 9000
resources:
  cpu: 2
  memory: 2048
ports:
- 9000
- 8443
tags:
- ide
- vscode
- code-server
priority: P1
wave: 1
env:
  ABX_SERVER_TOKEN: ''
  CODE_SERVER_PASSWORD: ''
smoke:
- command: code_server_version
  expect: 4.141.0
- command: code_server_self_test
  expect: CODE_SERVER_OK
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
