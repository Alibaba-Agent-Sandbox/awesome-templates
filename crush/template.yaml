name: crush
version: "1.0.2"
description: Official Crush0.98.1 native CLI with explicit compatible provider and
  private configuration.
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 5
base: fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>
generation: 2
start_cmd: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
ready_cmd: agent-sandbox-server healthcheck --port 9000
resources:
  cpu: 2
  memory: 2048
ports:
- 9000
tags:
- crush
- coding-agent
- openai-compatible
priority: P0
wave: 1
env:
  ABX_SERVER_TOKEN: ''
  CRUSH_API_KEY: ''
  CRUSH_BASE_URL: ''
  CRUSH_MODEL: ''
smoke:
- command: crush_version
  expect: 0.98.1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
