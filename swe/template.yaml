name: swe
version: 1.1.0
description: Pinned mini-SWE-agent with one genuine SWE-bench instance and independent
  non-Docker evaluation.
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 2
base: fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>
generation: 2
start_cmd: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
ready_cmd: agent-sandbox-server healthcheck --port 9000
resources:
  cpu: 2
  memory: 2048
ports:
- 9000
tags:
- swe-bench
- mini-swe-agent
- evaluation
priority: P0
wave: 2
tested_on: [alicloud-express, opensandbox]
capabilities:
- shell
- files
- code
- ports
env:
  ABX_SERVER_TOKEN: ''
  SWE_API_KEY: ''
  SWE_BASE_URL: ''
  SWE_MODEL: ''
  SWE_MODEL_PROTOCOL: text
smoke:
- command: swe_version
  args: {}
  expect: mini-swe-agent 2.4.6
