name: cursor-agent
version: "1.0.0"
description: "Pinned original Cursor Agent CLI with bounded headless named commands and explicit tool permission."
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 4096
ports: [9000]
tags: [cursor, coding-agent, cli]
priority: P1
wave: 2
env:
  ABX_SERVER_TOKEN: ""
  CURSOR_API_KEY: ""
  WORKSPACE: /home/user/app
smoke:
  - command: agent_version
    args: {}
    expect: "2026.10.19-6bbf2c4"
  - command: agent_native_check
    args: {}
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
