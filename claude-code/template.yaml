name: claude-code
version: "1.0.0"
description: "Claude Code Agent 运行环境 - Anthropic Claude 驱动的 AI 编程助手"
author: "alibaba-agent-sandbox"
tags:
  - claude
  - anthropic
  - ai-coding
  - ai-agent

base: python:3.12-slim

system_packages:
  - python3
  - python3-pip
  - git
  - curl
  - ripgrep
  - build-essential

python_packages:
  - anthropic
  - httpx
  - rich

node_packages:
  - "@anthropic-ai/claude-code"

capabilities:
  - shell
  - files
  - code
  - terminal
  - ports

ports:
  - 9000


env:
  ANTHROPIC_API_KEY: ""
  WORKSPACE: "/app"

resources:
  cpu: 2
  memory: 4096
