name: claude-code
version: "1.1.1"
description: "Pinned Claude Code CLI with named commands and workspace artifacts."
author: "alibaba-agent-sandbox"
license: Apache-2.0
spec_version: 2
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 2048
ports: [9000]
tags: [claude, anthropic, ai-coding, ai-agent]
priority: P0
wave: 1
tested_on: []
capabilities: [shell, files, code, terminal, ports]
env:
  ANTHROPIC_API_KEY: ""
  ABX_SERVER_TOKEN: ""
  WORKSPACE: "/home/user/app"
smoke:
  - command: claude_version
    args: {}
    expect: "2.0.76 (Claude Code)"
