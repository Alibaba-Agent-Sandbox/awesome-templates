name: amp
version: "1.0.0"
description: "Amp 编码 CLI 运行环境，预装 Sourcegraph Amp"
author: "alibaba-agent-sandbox"
tags:
  - amp
  - sourcegraph
  - ai-coding
  - ai-agent

base: python:3.12-slim

system_packages:
  - git
  - curl
  - ca-certificates
  - ripgrep

node_packages:
  - "@ampcode/cli@0.0.1791964847-g13f24a"

capabilities:
  - shell
  - files
  - code
  - ports

ports:
  - 9000

env:
  AMP_API_KEY: ""

resources:
  cpu: 2
  memory: 4096
