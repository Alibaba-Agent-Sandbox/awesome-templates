name: qoder
version: "1.1.1"
description: "Pinned Qoder headless CLI with typed named commands and a local Python compatibility command."
author: "alibaba-agent-sandbox"
license: Apache-2.0
spec_version: 2
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 2048
ports: [9000]
tags: [qoder, ai-coding, development]
priority: P2
wave: other
tested_on: [alicloud-express, opensandbox]
capabilities: [shell, files, code, ports]
env:
  WORKSPACE: "/home/user/app"
  ABX_SERVER_TOKEN: ""
  QODER_PERSONAL_ACCESS_TOKEN: ""
smoke:
  - command: qoder_version
    args: {}
    expect: "1.1.72"
