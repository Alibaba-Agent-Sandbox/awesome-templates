name: qoder
version: "1.0.0"
description: "Qoder AI 编程助手运行环境 - 集成 Python 与 Node.js 的智能开发沙箱"
author: "alibaba-agent-sandbox"
tags:
  - qoder
  - ai-coding
  - ai-agent
  - development

base: python:3.12-slim

system_packages:
  - python3
  - python3-pip
  - git
  - curl
  - wget
  - ripgrep
  - jq
  - build-essential
  - openssh-client
  - ca-certificates

python_packages:
  - httpx
  - rich
  - pyyaml

capabilities:
  - shell
  - files
  - code
  - terminal
  - ports

ports:
  - 9000


env:
  WORKSPACE: "/app"

resources:
  cpu: 2
  memory: 4096
