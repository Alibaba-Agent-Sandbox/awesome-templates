name: browser-automation
version: 2.2.0
description: Isolated headless Chromium navigation, screenshots, text extraction,
  and form filling.
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 2
base: fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>
generation: 2
start_cmd: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
ready_cmd: agent-sandbox-server healthcheck --port 9000
resources:
  cpu: 2
  memory: 2048
ports:
- 9000
tags:
- browser
- playwright
- chromium
- automation
priority: P0
wave: 1
tested_on: [alicloud-express, opensandbox]
capabilities:
- shell
- files
- code
- ports
env:
  PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
  ABX_SERVER_TOKEN: ''
smoke:
- command: browse
  args:
    url: data:text/html,<title>ABX_E2E_OK</title><h1>ABX_E2E_OK</h1>
    action: extract
  expect:
    action: extract
    title: ABX_E2E_OK
    text: ABX_E2E_OK
- command: mcp_self_test
  expect: PLAYWRIGHT_MCP_OK
