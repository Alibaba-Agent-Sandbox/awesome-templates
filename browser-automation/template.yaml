name: browser-automation
version: "1.0.0"
description: "浏览器自动化沙箱环境 - 预装 Playwright + Chromium，支持网页抓取与 UI 测试"
author: "alibaba-agent-sandbox"
tags:
  - browser
  - playwright
  - chromium
  - automation
  - web-scraping

base: python:3.12-slim

system_packages:
  - python3
  - python3-pip
  - nodejs
  - npm
  - curl
  - wget
  - xvfb
  - jq

python_packages:
  - playwright>=1.40.0
  - beautifulsoup4
  - lxml
  - httpx
  - Pillow

commands:
  - python3 -m playwright install chromium
  - python3 -m playwright install-deps chromium

capabilities:
  - shell
  - files
  - code
  - ports

ports:
  - 9000


env:
  DISPLAY: ":99"
  PLAYWRIGHT_BROWSERS_PATH: "/root/.cache/ms-playwright"

resources:
  cpu: 2
  memory: 4096
