name: appworld
version: "1.0.6"
description: "Original AppWorld0.1.3.post1 engine and evaluator, private protected bundles and explicit compatible-model API bridge."
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 4
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources: {cpu: 2, memory: 2048}
ports: [9000]
tags: [appworld, benchmark, function-calling, evaluation]
priority: P2
wave: 2
env:
  ABX_SERVER_TOKEN: ""
  APPWORLD_MODEL_API_KEY: ""
  APPWORLD_MODEL_BASE_URL: ""
  APPWORLD_MODEL: ""
  WORKSPACE: "/home/user/workspace"
smoke:
  - command: appworld_native_smoke
    expect: "original AppWorld0.1.3.post1 native API and private cleanup OK"
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
