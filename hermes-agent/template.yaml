name: hermes-agent
version: "1.0.0"
description: "Hermes Agent 运行环境 - NousResearch Hermes 系列模型驱动的 AI Agent"
author: "alibaba-agent-sandbox"
tags:
  - hermes
  - nousresearch
  - ai-agent
  - tool-calling

base: python:3.12-slim

system_packages:
  - python3
  - python3-pip
  - git
  - curl
  - build-essential
  - ripgrep

python_packages:
  - uv
  - openai>=1.0
  - httpx
  - rich
  - pyyaml

capabilities:
  - shell
  - files
  - code
  - ports

ports:
  - 9000


env:
  OPENAI_API_KEY: ""
  WORKSPACE: "/app"

resources:
  cpu: 2
  memory: 4096
