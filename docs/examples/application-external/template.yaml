specVersion: 1
name: application-external
sandbox:
  agent:
    provider: alicloud-express
    template:
      reference: existing-sandbox-template
      region: cn-hangzhou
serving:
  api:
    component: serverless-devs/fc3@0.1.26
    props:
      region: cn-hangzhou
      functionName: sandbox-api
      runtime: custom-container
      customContainerConfig:
        image: registry.example/server:1
        port: 9000
      environmentVariables:
        SANDBOX_TEMPLATE_ID: ${resources.agent.output.templateId}
