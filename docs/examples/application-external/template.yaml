specVersion: 1
name: native-fc-serving
deployment:
  edition: 3.0.0
  name: native-fc-serving
  access: default
  resources:
    api:
      component: fc3@0.1.26
      props:
        region: ${env('ALIBABA_CLOUD_REGION')}
        functionName: native-fc-serving
        runtime: custom-container
        cpu: 1
        memorySize: 4096
        timeout: 60
        customContainerConfig:
          image: ${env('SERVING_IMAGE')}
          port: 9000
