name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==9.1.1
      - run: python scripts/check_docs.py
      - run: python -m pytest -q scripts/test_check_docs.py

  dev-services-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: debian:13-slim
    steps:
      - name: Install exact database engines and test prerequisites
        run: |
          mkdir -p /etc/postgresql-common
          printf 'create_main_cluster = false\n' > /etc/postgresql-common/createcluster.conf
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 755 /usr/sbin/policy-rc.d
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv util-linux passwd postgresql-17=17.11-0+deb13u1 postgresql-client-17=17.11-0+deb13u1 libpq5=17.11-0+deb13u1 redis-server=5:8.0.2-3+deb13u3 redis-tools=5:8.0.2-3+deb13u3
          useradd --create-home --uid 1001 service-test
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact paired public server SDK
        uses: actions/checkout@v4
        with:
          repository: Alibaba-Agent-Sandbox/python-sdk
          ref: e2cb27e24fde0a67112f82b8d44af463445a5d1a
          path: vendor/python-sdk
          persist-credentials: false
      - name: Install test dependencies
        run: |
          python3 -m venv /tmp/database-venv
          /tmp/database-venv/bin/pip install ./vendor/python-sdk/server-sdk httpx==0.28.1 pytest==9.1.1 pyyaml==6.0.3
          chown -R service-test:service-test "$GITHUB_WORKSPACE"
      - name: Exercise actual authenticated engines and HTTP as non-root
        env:
          E2E_REQUIRE_DATABASES: "1"
        run: |
          runuser -u service-test -- /tmp/database-venv/bin/python -m pytest -q dev-services/test_commands.py
          runuser -u service-test -- env PATH="/tmp/database-venv/bin:$PATH" /tmp/database-venv/bin/python - <<'PYCODE'
          from pathlib import Path
          from scripts.run_local_e2e import _run_one
          status, detail = _run_one(Path("dev-services").resolve(), "")
          print(status, detail)
          assert status == "pass", detail
          PYCODE

  document-tools-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: debian:13-slim
    steps:
      - name: Install pinned Debian document engine and test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv pandoc=3.1.11.1+ds-2 pandoc-data=3.1.11.1-3
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout paired pinned public SDK sources
        uses: actions/checkout@v4
        with:
          repository: alibaba-agent-sandbox/python-sdk
          ref: e2cb27e24fde0a67112f82b8d44af463445a5d1a
          path: vendor/python-sdk
          persist-credentials: false
      - name: Install scoped test dependencies
        run: |
          python3 -m venv /tmp/document-venv
          /tmp/document-venv/bin/pip install ./vendor/python-sdk/server-sdk ./vendor/python-sdk/client-sdk httpx==0.28.1 pytest==9.1.1 pyyaml==6.0.3 jsonschema==4.26.0
      - name: Verify actual document conversion, limits, SDK and external HTTP artifacts
        env:
          E2E_REQUIRE_DOCUMENT: "1"
        run: |
          /tmp/document-venv/bin/python -m pytest -q document-tools/test_commands.py document-tools/test_http.py
          PATH="/tmp/document-venv/bin:$PATH" /tmp/document-venv/bin/python - <<'PY'
          from pathlib import Path
          from scripts.run_local_e2e import _run_one
          status, detail = _run_one(Path("document-tools").resolve(), "")
          print(status, detail)
          assert status == "pass", detail
          PY

  media-tools-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: debian:13-slim
    steps:
      - name: Install the exact Debian media engine and test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv ffmpeg=7:7.1.5-0+deb13u1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout the public pinned server SDK
        uses: actions/checkout@v4
        with:
          repository: alibaba-agent-sandbox/python-sdk
          ref: e2cb27e24fde0a67112f82b8d44af463445a5d1a
          path: vendor/python-sdk
          persist-credentials: false
      - name: Install scoped test dependencies
        run: |
          python3 -m venv /tmp/media-venv
          /tmp/media-venv/bin/pip install ./vendor/python-sdk/server-sdk ./vendor/python-sdk/client-sdk httpx==0.28.1 pytest==9.1.1 pyyaml==6.0.3 jsonschema==4.26.0
      - name: Verify real CPU codecs, limits, descendants and HTTP artifact bytes
        env:
          E2E_REQUIRE_MEDIA: "1"
        run: |
          /tmp/media-venv/bin/python -m pytest -q media-tools/test_commands.py media-tools/test_http.py
          PATH="/tmp/media-venv/bin:$PATH" /tmp/media-venv/bin/python - <<'PY'
          from pathlib import Path
          from scripts.run_local_e2e import _run_one
          status, detail = _run_one(Path("media-tools").resolve(), "")
          print(status, detail)
          assert status == "pass", detail
          PY

  local-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_RUN_LLM: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the Python SDK
        uses: actions/checkout@v4
        with:
          repository: alibaba-agent-sandbox/python-sdk
          # Includes the postponed-annotation dataclass command-loader fix.
          ref: e2cb27e24fde0a67112f82b8d44af463445a5d1a
          path: vendor/python-sdk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Install the in-sandbox server and the test client
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python -m pip install ./vendor/python-sdk/server-sdk httpx==0.28.1 pyyaml==6.0.3 jsonschema==4.26.0 pytest==9.1.1 playwright==1.58.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3-tools

      - name: Install pinned upstream CLIs for local smoke checks
        run: |
          npm install --global @openai/codex@0.162.1 @anthropic-ai/claude-code@2.0.76 opencode-ai@1.19.0 @factory/cli@0.241.1 @qwen-code/qwen-code@0.23.0 @ampcode/cli@0.0.1792022479-ge66e24 @google/gemini-cli@0.64.0 @qoder-ai/qodercli@1.1.72 openclaw@2026.10.4 @moonshot-ai/kimi-code@2.2.0
          mkdir -p "$RUNNER_TEMP/pi-cli"
          cp pi/package.json pi/package-lock.json "$RUNNER_TEMP/pi-cli/"
          npm ci --prefix "$RUNNER_TEMP/pi-cli" --ignore-scripts --omit=dev --registry=https://registry.npmjs.org
          test "$("$RUNNER_TEMP/pi-cli/node_modules/.bin/pi" --version)" = "1.3.0"
          echo "$RUNNER_TEMP/pi-cli/node_modules/.bin" >> "$GITHUB_PATH"
          python pi/install_tools.py --root "$RUNNER_TEMP/pi-tools" --bin "$RUNNER_TEMP/pi-tools-bin"
          echo "$RUNNER_TEMP/pi-tools-bin" >> "$GITHUB_PATH"
          npm ci --prefix apply-patch --omit=dev --ignore-scripts --no-audit --no-fund
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --prefix browser-automation --omit=dev --ignore-scripts --no-audit --no-fund
          echo "MCP_NODE_MODULES=$GITHUB_WORKSPACE/browser-automation/node_modules" >> "$GITHUB_ENV"
          python apply-patch/install_alias.py --node-modules "$GITHUB_WORKSPACE/apply-patch/node_modules" --bin "$RUNNER_TEMP/apply-patch-bin"
          echo "$RUNNER_TEMP/apply-patch-bin" >> "$GITHUB_PATH"
          codex --version
          claude --version
          test "$(opencode --version)" = "1.19.0"

      - name: Install the pinned standalone browser IDE for real local checks
        run: |
          python code-server/install_runtime.py --prefix "$RUNNER_TEMP/code-server-runtime"
          echo "$RUNNER_TEMP/code-server-runtime/current/bin" >> "$GITHUB_PATH"
      - name: Install pinned official Goose for real local checks
        run: |
          python goose/install_runtime.py --prefix "$RUNNER_TEMP/goose-runtime"
          echo "$RUNNER_TEMP/goose-runtime" >> "$GITHUB_PATH"

      - name: Install pinned official Crush for real native checks
        run: |
          python crush/install_runtime.py --prefix "$RUNNER_TEMP/crush-runtime"
          echo "$RUNNER_TEMP/crush-runtime" >> "$GITHUB_PATH"

      - name: Checkout the pinned upstream Hermes runtime
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 297552a9d646119871391d202509822cd86330df
          path: vendor/hermes-agent
          persist-credentials: false

      - name: Install the pinned upstream Hermes runtime
        run: |
          python -m pip install uv==0.12.3
          hermes_source="$GITHUB_WORKSPACE/vendor/hermes-agent"
          test "$(git -C "$hermes_source" rev-parse HEAD)" = 297552a9d646119871391d202509822cd86330df
          mkdir -p "$RUNNER_TEMP/hermes-bin"
          UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/hermes-python" uv sync --project "$hermes_source" --frozen --no-default-groups --python 3.14.6
          "$hermes_source/.venv/bin/python" "$hermes_source/scripts/write_install_stamp.py" --output "$hermes_source/install-stamp.json" --commit 297552a9d646119871391d202509822cd86330df --base-version 0.22.1 --distance 0 --source ci --update-mechanism external
          ln -s "$hermes_source/.venv/bin/hermes" "$RUNNER_TEMP/hermes-bin/hermes"
          echo "$RUNNER_TEMP/hermes-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/hermes-bin/hermes" --version

      - name: Lint templates and unit-test the checker
        run: |
          python3 scripts/test_local_cleanup.py && python3 scripts/test_spec_tools.py
          python -m pytest -q scripts/test_prepare_steps.py scripts/test_ci_image.py scripts/test_ci_image_archive.py scripts/test_express_cleanup.py scripts/test_sdk_creation.py
          python3 scripts/check_template.py --all --strict

      - name: Run process, privacy, and acceptance-harness regressions
        run: |
          python -m pytest -q browser-automation/test_mcp.py browser-automation/test_pdf_runtime.py
          python -m pip install --require-hashes -r scripts/requirements-preview.txt
          python -m pytest -q code-server/test_commands.py code-server/test_browser_local.py scripts/test_preview_proxy.py
          python -m pytest -q polyglot-toolchain/test_commands.py
          python -m pytest -q apply-patch/test_commands.py
          python -m pytest -q goose/test_commands.py goose/test_controller.py
          python -m pytest -q crush/test_commands.py crush/test_controller.py
          python -m pytest -q python-hello/test_command_errors.py
          python -m pytest -q node-web/test_startup.py node-web/test_http_output.py
          python -m pytest -q claude-code/tests
          python -m pytest -q codex/test_commands.py
          python -m pytest -q opencode/test_commands.py opencode/test_e2e_protocol.py
          python -m pytest -q amp/test_commands.py amp/test_e2e_protocol.py
          python -m pytest -q droid/test_commands.py droid/test_e2e_protocol.py
          python -m pytest -q gemini/test_commands.py gemini/test_e2e_protocol.py
          python -m pytest -q openclaw/test_commands.py
          python -m pytest -q kimi-code/test_commands.py
          python -m pytest -q qoder/test_commands.py qoder/test_e2e_protocol.py
          python -m pytest -q deepseek-harness/test_commands.py deepseek-harness/test_e2e_protocol.py
          python -m pytest -q hermes-agent/test_commands.py hermes-agent/test_e2e_protocol.py
          python -m pytest -q pi/test_commands.py pi/test_e2e_protocol.py pi/test_cli_protocol.py pi/test_install_tools.py scripts/test_select_image_templates.py
          python -m pytest -q ocr/test_commands.py ocr/test_http.py
          python -m pytest -q aider/test_commands.py aider/test_e2e_protocol.py
          python -m pytest -q swe/test_commands.py swe/test_e2e_protocol.py
          python -m pytest -q osworld/test_commands.py osworld/test_tasks.py osworld/test_http.py
          python -m pytest -q agents-cli/test_protocol.py agents-cli/test_sdk_verifier.py
          python -m pytest -q scripts/test_express_runtime_socket.py
          python -m pytest -q qwen-code/test_commands.py qwen-code/test_e2e_protocol.py
          python -m pytest -q codex-agent-api/test_commands.py codex-agent-api/test_e2e_protocol.py codex-agent-api/test_http_runtime.py

      - name: Run template e2e against locally started servers
        run: |
          python3 scripts/run_local_e2e.py
          echo "Local L0 checks only; image builds, cloud deployment, and real model acceptance are not covered."
