name: Template images (L1)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        template:
          - agents-cli
          - amp
          - browser-automation
          - claude-code
          - codex
          - codex-agent-api
          - deepseek-harness
          - droid
          - gemini
          - hermes-agent
          - node-web
          - openclaw
          - opencode
          - python-hello
          - qoder
          - qwen-code
    env:
      TEMPLATE: ${{ matrix.template }}
      SERVER_SDK_SHA: e2cb27e24fde0a67112f82b8d44af463445a5d1a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout the public pinned server source
        uses: actions/checkout@v4
        with:
          repository: alibaba-agent-sandbox/python-sdk
          ref: e2cb27e24fde0a67112f82b8d44af463445a5d1a
          path: vendor/python-sdk
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the source server wheel
        run: |
          test "$(git -C vendor/python-sdk rev-parse HEAD)" = "$SERVER_SDK_SHA"
          python -m pip install pyyaml==6.0.3
          python -m pip wheel ./vendor/python-sdk/server-sdk --no-deps --wheel-dir "$RUNNER_TEMP/server-wheel"

      - name: Prepare the standalone template context
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil

          source = Path(os.environ["TEMPLATE"])
          assert re.fullmatch(r"[a-z0-9][a-z0-9-]*", source.name)
          wheels = list((Path(os.environ["RUNNER_TEMP"]) / "server-wheel").glob("agent_sandbox_server-*.whl"))
          assert len(wheels) == 1, "exactly one source-built server wheel is required"
          context = Path(os.environ["RUNNER_TEMP"]) / ("image-context-" + source.name)
          shutil.copytree(source, context, ignore=shutil.ignore_patterns(
              ".env", ".env.*", "*.whl", "__pycache__", ".pytest_cache"))
          shutil.copy2(wheels[0], context / wheels[0].name)
          dockerfile = context / "Dockerfile"
          lines = dockerfile.read_text().splitlines(keepends=True)
          from_count = 0
          for index, line in enumerate(lines):
              if re.match(r"^\s*FROM\s", line, re.IGNORECASE):
                  assert "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>" in line
                  lines[index] = line.replace("<region>", "cn-hangzhou").replace("<tag>", "v0.0.49")
                  from_count += 1
          assert from_count == 1, "this gate expects one Alibaba template base"
          # Keep the original SDK COPY/if branch. This is not abx's Dockerfile
          # rewrite/materialization test: an injected wheel selects its real branch.
          assert "COPY *.whl /tmp/" in dockerfile.read_text()
          dockerfile.write_text("".join(lines))
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write(f"L1_CONTEXT={context}\n")
          print(f"{source.name}: standalone context; SDK source {os.environ['SERVER_SDK_SHA']}; wheel {wheels[0].name}")
          PY

      - name: Build the actual image without publishing
        run: |
          set -euo pipefail
          docker build --progress=plain --tag "abx-l1:$TEMPLATE" "$L1_CONTEXT" 2>&1 | tee "$RUNNER_TEMP/$TEMPLATE-build.log"

      - name: Check installed pins and keyless smoke as the image user
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee -a "$RUNNER_TEMP/$TEMPLATE-build.log"
          import json
          import os
          from pathlib import Path
          import subprocess

          import yaml

          template = os.environ["TEMPLATE"]
          config = yaml.safe_load((Path(template) / "template.yaml").read_text())
          pins = {
              "agents-cli": [("node --version", "v24.16.0"), ("codex --version", "0.162.1"), ("qwen --version", "0.23.0")],
              "amp": [("amp version", "0.0.1792022479-ge66e24")],
              "claude-code": [("claude --version", "2.0.76")],
              "codex": [("codex --version", "0.162.1")],
              "codex-agent-api": [("codex --version", "0.162.1")],
              "droid": [("droid --version", "0.241.1")],
              "gemini": [("gemini --version", "0.64.0")],
              "hermes-agent": [("hermes --version", "v0.22.1")],
              "openclaw": [("node --version", "v24.16.0"), ("openclaw --version", "2026.10.4")],
              "opencode": [("opencode --version", "1.19.0")],
              "qoder": [("qodercli --version", "1.1.72")],
              "qwen-code": [("qwen --version", "0.23.0")],
          }
          payload = {"smoke": config["smoke"], "pins": pins.get(template, []), "template": template}
          code = r'''
          import importlib.metadata
          import importlib.util
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess
          import sys

          from agent_sandbox.server.registry import default_registry

          payload = json.loads(sys.argv[1])
          assert os.geteuid() != 0, "the image must run as its non-root USER"
          assert importlib.metadata.version("agent-sandbox-server") == "0.3.0"
          print("PASS agent-sandbox-server 0.3.0 (source wheel); non-root image user", flush=True)
          for command, expected in payload["pins"]:
              result = subprocess.run(shlex.split(command), text=True, capture_output=True, timeout=60)
              assert result.returncode == 0 and expected in result.stdout.split(), command + " pin mismatch"
              print("PASS installed pin: " + command + " -> " + expected, flush=True)
          for package, expected in ({"browser-automation": {"playwright": "1.58.0"},
                                     "deepseek-harness": {"httpx": "0.28.1"}}.get(payload["template"], {})).items():
              assert importlib.metadata.version(package) == expected
              print("PASS installed pin: " + package + " " + expected, flush=True)
          path = Path("/home/user/app/commands.py")
          spec = importlib.util.spec_from_file_location("image_smoke_commands", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          for smoke in payload["smoke"]:
              registered = default_registry().get(smoke["command"])
              assert registered is not None, "missing smoke command " + smoke["command"]
              result = registered.fn(**smoke.get("args", {}))
              if "expect" in smoke:
                  expected = smoke["expect"]
                  assert (result.strip() == expected.strip() if isinstance(result, str) and isinstance(expected, str)
                          else result == expected), "smoke result mismatch: " + smoke["command"]
              print("PASS keyless image command: " + smoke["command"], flush=True)
          print("L1 image build/runtime checks only; no provider deployment or model acceptance", flush=True)
          '''
          subprocess.run(["docker", "run", "--rm", "--network", "none", "--entrypoint", "python3",
                          "abx-l1:" + template, "-c", code, json.dumps(payload)], check=True, timeout=240)
          PY

      - name: Retain the image build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-${{ matrix.template }}
          path: ${{ runner.temp }}/${{ matrix.template }}-build.log
          if-no-files-found: warn
