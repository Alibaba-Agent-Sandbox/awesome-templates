name: Template images (L1)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      templates:
        description: "Comma-separated catalog template names to build (no full matrix by default)"
        default: python-hello
        required: true
        type: string
      export_images:
        description: "Export selected successful images for a separate local transfer"
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      templates: ${{ steps.select.outputs.templates }}
      export_all_selected: ${{ steps.select.outputs.export_all_selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pyyaml==6.0.3 jsonschema==4.26.0
      - id: select
        name: Select changed image contexts or explicit dispatch targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_TEMPLATES: ${{ inputs.templates || 'python-hello' }}
        run: |
          templates=$(python scripts/select_image_templates.py --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --templates "$REQUESTED_TEMPLATES")
          echo "templates=$templates" >> "$GITHUB_OUTPUT"
          export_all_selected=$(python scripts/select_image_templates.py --export-policy)
          echo "export_all_selected=$export_all_selected" >> "$GITHUB_OUTPUT"
          echo "Selected image contexts: $templates"

  image-build:
    needs: plan
    if: needs.plan.outputs.templates != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        template: ${{ fromJSON(needs.plan.outputs.templates) }}
    env:
      TEMPLATE: ${{ matrix.template }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install specification check prerequisites
        run: python -m pip install -r scripts/requirements-spec.txt

      - name: Prepare the standalone template context
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import shutil

          source = Path(os.environ["TEMPLATE"])
          assert re.fullmatch(r"[a-z0-9][a-z0-9-]*", source.name)
          context = Path(os.environ["RUNNER_TEMP"]) / ("image-context-" + source.name)
          shutil.copytree(source, context, ignore=shutil.ignore_patterns(
              ".env", ".env.*", "*.whl", "__pycache__", ".pytest_cache"))
          dockerfile = context / "Dockerfile"
          lines = dockerfile.read_text().splitlines(keepends=True)
          from_count = 0
          for index, line in enumerate(lines):
              if line.strip() == "FROM fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>":
                  lines[index] = line.replace("<region>", "cn-hangzhou").replace("<tag>", "v0.0.49")
                  from_count += 1
          assert from_count == 1, "this gate expects one Alibaba template base"
          dockerfile.write_text("".join(lines))
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write(f"L1_CONTEXT={context}\n")
          print(f"{source.name}: unchanged public server package install; default provider base resolved")
          PY

      - name: Build the actual image without publishing
        run: |
          set -euo pipefail
          docker build --progress=plain --tag "abx-l1:$TEMPLATE" "$L1_CONTEXT" 2>&1 | tee "$RUNNER_TEMP/$TEMPLATE-build.log"

      - name: Check installed pins and keyless smoke as the image user
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee -a "$RUNNER_TEMP/$TEMPLATE-build.log"
          import json
          import os
          from pathlib import Path
          import subprocess

          import yaml
          from scripts.server_package import server_version

          template = os.environ["TEMPLATE"]
          config = yaml.safe_load((Path(template) / "template.yaml").read_text())
          pins = {
              "polyglot-toolchain": [("go version", "go1.25.14"), ("rustc --version", "1.90.0"), ("cargo --version", "1.90.0"), ("javac --version", "21.0.12.1")],
              "agents-cli": [("node --version", "v24.16.0"), ("codex --version", "0.162.1"), ("qwen --version", "0.23.0")],
              "pi": [("node --version", "v24.16.0"), ("pi --version", "1.3.0"), ("fd --version", "10.5.0"), ("rg --version", "15.2.0")],
              "amp": [("amp version", "0.0.1792022479-ge66e24")],
              "claude-code": [("claude --version", "2.0.76")],
              "codex": [("codex --version", "0.162.1")],
              "codex-agent-api": [("codex --version", "0.162.1")],
              "droid": [("droid --version", "0.241.1")],
              "gemini": [("gemini --version", "0.64.0")],
              "hermes-agent": [("hermes --version", "v0.22.1")],
              "openclaw": [("node --version", "v24.16.0"), ("openclaw --version", "2026.10.4")],
              "opencode": [("opencode --version", "1.19.0")],
              "qoder": [("qodercli --version", "1.1.72")],
              "goose": [("goose --version", "1.54.0")],
              "kimi-code": [("node --version", "v24.16.0"), ("kimi --version", "2.2.0")],
              "qwen-code": [("qwen --version", "0.23.0")],
          }
          payload = {"smoke": config["smoke"], "pins": pins.get(template, []), "template": template, "server_version": server_version(Path(template))}
          code = r'''
          import importlib.metadata
          import importlib.util
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess
          import sys

          from agent_sandbox.server.registry import default_registry

          payload = json.loads(sys.argv[1])
          assert os.geteuid() != 0, "the image must run as its non-root USER"
          import tempfile
          with tempfile.TemporaryDirectory(prefix=".l1-workspace-", dir="/home/user/app") as workspace:
              artifact=Path(workspace)/"write-probe.txt"
              artifact.write_bytes(b"workspace-write-proof")
              assert artifact.read_bytes()==b"workspace-write-proof"
          print("PASS actual non-root workspace write/read/removal",flush=True)
          assert importlib.metadata.version("agent-sandbox-server") == payload["server_version"]
          print("PASS public agent-sandbox-server " + payload["server_version"] + "; non-root image user", flush=True)
          for command, expected in payload["pins"]:
              result = subprocess.run(shlex.split(command), text=True, capture_output=True, timeout=60)
              assert result.returncode == 0 and expected in result.stdout.split(), command + " pin mismatch"
              print("PASS installed pin: " + command + " -> " + expected, flush=True)
          for package, expected in ({"browser-automation": {"playwright": "1.58.0"},
                                     "deepseek-harness": {"httpx": "0.28.1"}}.get(payload["template"], {})).items():
              assert importlib.metadata.version(package) == expected
              print("PASS installed pin: " + package + " " + expected, flush=True)
          path = Path("/home/user/app/commands.py")
          spec = importlib.util.spec_from_file_location("image_smoke_commands", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          for smoke in payload["smoke"]:
              registered = default_registry().get(smoke["command"])
              assert registered is not None, "missing smoke command " + smoke["command"]
              result = registered.fn(**smoke.get("args", {}))
              if "expect" in smoke:
                  expected = smoke["expect"]
                  assert (result.strip() == expected.strip() if isinstance(result, str) and isinstance(expected, str)
                          else result == expected), "smoke result mismatch: " + smoke["command"]
              print("PASS keyless image command: " + smoke["command"], flush=True)
          print("L1 image build/runtime checks only; no provider deployment or model acceptance", flush=True)
          '''
          subprocess.run(["docker", "run", "--rm", "--network", "none", "--entrypoint", "python3",
                          "abx-l1:" + template, "-c", code, json.dumps(payload)], check=True, timeout=240)
          PY

      - name: Export selected images for a separate local registry transfer
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.export_images) || (github.event_name != 'workflow_dispatch' && (needs.plan.outputs.export_all_selected == 'true' || matrix.template == 'python-hello' || matrix.template == 'pi')))
        run: |
          docker image save --output "$RUNNER_TEMP/$TEMPLATE-image.tar" "abx-l1:$TEMPLATE"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from scripts.server_package import server_version

          root = Path(os.environ["RUNNER_TEMP"])
          template = os.environ["TEMPLATE"]
          archive = root / (template + "-image.tar")
          with archive.open("rb") as stream:
              checksum = hashlib.file_digest(stream, "sha256").hexdigest()
          (root / (template + "-image.tar.sha256")).write_text(checksum + "  " + archive.name + "\n")
          metadata = {
              "format": "docker-archive",
              "origin": "template-image-l1",
              "template": template,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "checkout_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_head_commit": os.environ["SOURCE_HEAD_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "server_package_version": server_version(Path(template)),
              "base_image": "fc-e2b-registry.cn-hangzhou.cr.aliyuncs.com/runtime/base:v0.0.49",
              "local_image_id": subprocess.check_output(
                  ["docker", "image", "inspect", "--format", "{{.Id}}", "abx-l1:" + template], text=True).strip(),
              "archive_sha256": checksum,
              "acceptance": "L1 only; no provider registration, registry push, or model call",
          }
          (root / (template + "-image-metadata.json")).write_text(json.dumps(metadata, indent=2) + "\n")
          print("Exported the already built selected Docker archive and SHA256; no image rebuild or registry credentials")
          PY

      - name: Retain selected transferable images for one day
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.export_images) || (github.event_name != 'workflow_dispatch' && (needs.plan.outputs.export_all_selected == 'true' || matrix.template == 'python-hello' || matrix.template == 'pi')))
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.template }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ matrix.template }}-image.tar
            ${{ runner.temp }}/${{ matrix.template }}-image.tar.sha256
            ${{ runner.temp }}/${{ matrix.template }}-image-metadata.json
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - name: Retain the image build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-${{ matrix.template }}
          path: ${{ runner.temp }}/${{ matrix.template }}-build.log
          if-no-files-found: warn
