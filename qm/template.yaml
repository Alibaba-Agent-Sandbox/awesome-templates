name: qm
version: "1.0.1"
description: "Original QM0.1.0 native Pi harness and tool loop with explicit compatible model on an owned Express computer."
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 2
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources: {cpu: 2, memory: 2048}
ports: [9000]
tags: [qm, sandbox, sdk, coding-agent]
priority: P2
wave: 2
tested_on: [alicloud-express]
capabilities: [shell, files, code, ports]
env:
  ABX_SERVER_TOKEN: ""
  QM_SANDBOX_BASE_URL: "http://127.0.0.1:9000"
  QM_SANDBOX_TOKEN: ""
  WORKSPACE: "/home/user/app"
  QM_MODEL_API_KEY: ""
  QM_MODEL_BASE_URL: ""
  QM_MODEL: ""
smoke:
  - command: qm_version
    expect: {qm_version: "0.1.0", node_version: "24.16.0", sdk_version: "0.1.0"}
  - command: qm_native_check
    expect: {original_qm_harness: true, original_tool_context: true, actual_sdk_client: true}
