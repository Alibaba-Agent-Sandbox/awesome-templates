name: droid
version: "1.2.1"
description: "Genuine Factory Droid0.241.1 with isolated explicit compatible BYOK and bounded headless coding."
author: "alibaba-agent-sandbox"
license: Apache-2.0
spec_version: 5
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
tags: [droid, factory, ai-coding, ai-agent]
priority: P1
wave: 1
ports: [9000]
env:
  FACTORY_API_KEY: ""
  DROID_MODEL_API_KEY: ""
  DROID_MODEL_BASE_URL: ""
  DROID_MODEL: ""
  ABX_SERVER_TOKEN: ""
  WORKSPACE: "/home/user/app"
resources:
  cpu: 2
  memory: 2048
smoke:
  - command: droid_version
    args: {}
    expect: "0.241.1"
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
