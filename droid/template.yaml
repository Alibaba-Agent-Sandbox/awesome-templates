env:
  FACTORY_API_KEY: ""
  ABX_SERVER_TOKEN: ""
  WORKSPACE: "/home/user/app"
resources:
  cpu: 2
  memory: 2048
smoke:
  - command: droid_version
    args: {}
    expect: "0.241.1"
