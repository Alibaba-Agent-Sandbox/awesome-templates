specVersion: 1
name: droid
sandbox:
  template:
    source:
      dockerfile: Dockerfile
      context: .
    props:
      cpu: 2
      memory: 2048
  start: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
  ready: agent-sandbox-server healthcheck --port 9000
  instance:
    envs:
      FACTORY_API_KEY: ''
      DROID_MODEL_API_KEY: ''
      DROID_MODEL_BASE_URL: ''
      DROID_MODEL: ''
      ABX_SERVER_TOKEN: ''
      WORKSPACE: /home/user/app
  services:
    app:
      protocol: agent-sandbox-server
      version: 2
      port: 9000
      operations:
      - commands.list
      - commands.run
