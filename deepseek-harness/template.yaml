name: deepseek-harness
version: "1.0.0"
description: "DeepSeek Agent Runtime 运行环境 - DeepSeek 模型驱动的 AI 编程 Agent"
author: "alibaba-agent-sandbox"
tags:
  - deepseek
  - ai-agent
  - ai-coding
  - code-generation

base: python:3.12-slim

system_packages:
  - python3
  - python3-pip
  - git
  - curl
  - build-essential

python_packages:
  - openai>=1.0
  - httpx
  - rich

capabilities:
  - shell
  - files
  - code
  - ports

ports:
  - 9000


env:
  DEEPSEEK_API_KEY: ""
  WORKSPACE: "/app"

resources:
  cpu: 2
  memory: 4096
