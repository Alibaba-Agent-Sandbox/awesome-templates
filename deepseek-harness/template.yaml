name: deepseek-harness
version: "1.1.1"
description: "DeepSeek-compatible coding agent with bounded file and terminal tool calls."
author: "alibaba-agent-sandbox"
license: Apache-2.0
spec_version: 4
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 2048
ports: [9000]
tags: [deepseek-harness, ai-coding, ai-agent]
priority: P1
wave: 1
env:
  WORKSPACE: "/home/user/app"
  ABX_SERVER_TOKEN: ""
  DEEPSEEK_API_KEY: ""
  OPENAI_API_KEY: ""
  DEEPSEEK_BASE_URL: "https://api.deepseek.com"
  DEEPSEEK_MODEL: "deepseek-flash"
smoke:
  - command: deepseek_tools
    args: {}
    expect: "list_files,read_file,run_shell,write_file"
workflow_contract_version: 1
provides:
  app:
    protocol: agent-sandbox-server
    version: 2
    port: 9000
    operations:
    - commands.list
    - commands.run
default_workflow: application
workflows:
  application:
    kind: application
    input: source
    service: app
    startup: exec
    binding:
      transport: http
      endpoint: provider-port
      caller: host
      authentication: service-token
    operation: commands.run
    required_operations: []
