name: deepseek-harness
version: "1.1.1"
description: "DeepSeek-compatible coding agent with bounded file and terminal tool calls."
author: "alibaba-agent-sandbox"
license: Apache-2.0
spec_version: 2
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources:
  cpu: 2
  memory: 2048
ports: [9000]
tags: [deepseek-harness, ai-coding, ai-agent]
priority: P1
wave: 1
tested_on: [alicloud-express, opensandbox]
capabilities: [shell, files, code, ports]
env:
  WORKSPACE: "/home/user/app"
  ABX_SERVER_TOKEN: ""
  DEEPSEEK_API_KEY: ""
  OPENAI_API_KEY: ""
  DEEPSEEK_BASE_URL: "https://api.deepseek.com"
  DEEPSEEK_MODEL: "deepseek-flash"
smoke:
  - command: deepseek_tools
    args: {}
    expect: "list_files,read_file,run_shell,write_file"
