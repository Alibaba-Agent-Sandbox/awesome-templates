name: prime-agent
version: "1.0.0"
description: "Original stable native Prime Agent0.10.0 with fixed CPython REPL, explicit compatible provider and private owned lifecycle."
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 2
base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"
resources: {cpu: 2, memory: 2048}
ports: [9000]
tags: [prime-agent, coding-agent, rlm, python]
priority: P2
wave: 2
tested_on: [alicloud-express, opensandbox]
capabilities: [shell, files, code, ports]
env:
  ABX_SERVER_TOKEN: ""
  PRIME_MODEL_API_KEY: ""
  PRIME_MODEL_BASE_URL: ""
  PRIME_MODEL: ""
  WORKSPACE: "/home/user/workspace"
smoke:
  - command: prime_agent_version
    expect: {native_version: "0.10.0"}
  - command: prime_agent_kernel_check
    expect: {protocol_version: 3, required_imports_checked: 12}
