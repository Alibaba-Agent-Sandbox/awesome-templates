name: pi
version: "1.0.1"
description: "Official Pi coding CLI 1.3.0 with ephemeral compatible-model configuration and explicit writable tools."
author: "alibaba-agent-sandbox"
license: Apache-2.0
spec_version: 2

base: "fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>"
generation: 2
start_cmd: "agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py"
ready_cmd: "agent-sandbox-server healthcheck --port 9000"

resources:
  cpu: 2
  memory: 2048

ports:
  - 9000

tags:
  - pi
  - coding-agent
  - openai-compatible

priority: P0
wave: 1
tested_on: [alicloud-express]

capabilities:
  - shell
  - files
  - code
  - ports

env:
  ABX_SERVER_TOKEN: ""
  PI_API_KEY: ""
  PI_BASE_URL: ""
  PI_MODEL: ""

smoke:
  - command: pi_version
    args: {}
    expect: "1.3.0"
  - command: pi_tools_check
    args: {}
    expect: "read/find/grep/ls OK"
