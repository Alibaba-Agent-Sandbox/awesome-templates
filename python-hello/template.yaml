specVersion: 1
name: python-hello
sandbox:
  template:
    source:
      dockerfile: Dockerfile
      context: .
      profiles:
        portable:
          dockerfile: Dockerfile.portable
          context: .
    props:
      cpu: 2
      memory: 2048
  start: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
  ready: agent-sandbox-server healthcheck --port 9000
  instance:
    envs:
      LANG: C.UTF-8
      ABX_SERVER_TOKEN: ''
  services:
    app:
      protocol: agent-sandbox-server
      version: 2
      port: 9000
      operations:
      - commands.list
      - commands.run
