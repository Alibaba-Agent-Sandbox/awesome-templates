name: apply-patch
version: 1.0.0
description: Official Codex 0.162.1 patch dialect with file stdin, bounded process
  lifecycle and relative workspace paths.
author: alibaba-agent-sandbox
license: Apache-2.0
spec_version: 2
base: fc-e2b-registry.<region>.cr.aliyuncs.com/runtime/base:<tag>
generation: 2
start_cmd: agent-sandbox-server serve --port 9000 --commands /home/user/app/commands.py
ready_cmd: agent-sandbox-server healthcheck --port 9000
resources:
  cpu: 2
  memory: 2048
ports:
- 9000
tags:
- patch
- files
- codex
priority: P1
wave: 2
tested_on: [alicloud-express, opensandbox]
capabilities:
- shell
- files
- code
- ports
env:
  ABX_SERVER_TOKEN: ''
smoke:
- command: apply_patch_version
  expect: codex-cli 0.162.1
- command: apply_patch_smoke
  expect: APPLY_PATCH_OK
